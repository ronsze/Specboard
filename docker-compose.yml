services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: specboard
      POSTGRES_PASSWORD: specboard
      POSTGRES_DB: specboard
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specboard"]
      interval: 2s
      timeout: 3s
      retries: 20
