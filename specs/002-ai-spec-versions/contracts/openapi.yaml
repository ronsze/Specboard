openapi: 3.1.0
info:
  title: Specboard - AI spec 생성과 버전 이력
  version: 0.1.0
servers:
  - url: /api
security:
  - session: []
paths:
  /boards/{boardId}/features/{featureId}/spec:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    get:
      summary: 현재 spec (전 역할). 상태, 최신 버전, 항목과 출처, 미결 질문, 반영 대기 입력 수
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SpecView'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /boards/{boardId}/features/{featureId}/spec/versions:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    get:
      summary: 버전 이력, 최신순 (전 역할)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/VersionSummary'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /boards/{boardId}/features/{featureId}/spec/versions/{number}:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}, {$ref: '#/components/parameters/number'}]
    get:
      summary: 특정 버전의 내용 (전 역할)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VersionDetail'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없는 버전}
  /boards/{boardId}/features/{featureId}/spec/diff:
    parameters:
      - {$ref: '#/components/parameters/boardId'}
      - {$ref: '#/components/parameters/featureId'}
      - {name: from, in: query, required: true, schema: {type: integer, minimum: 1}}
      - {name: to, in: query, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: 두 버전 비교 (전 역할). key 기준 추가·삭제·변경
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Diff'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없는 버전}
  /boards/{boardId}/features/{featureId}/spec/revert:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    post:
      summary: 이전 버전으로 되돌리기 (ADMIN). 선택 버전과 같은 내용의 새 버전을 만든다
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [toVersion], properties: {toVersion: {type: integer, minimum: 1}}}}}
      responses:
        '201': {description: 새 버전, content: {application/json: {schema: {$ref: '#/components/schemas/VersionSummary'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없는 버전}
        '409': {description: 확정 상태이거나 최신 버전과 내용이 같음}
  /boards/{boardId}/features/{featureId}/spec/finalize:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    post:
      summary: spec 확정 (ADMIN)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SpecView'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 확정할 버전이 없거나 이미 확정됨}
  /boards/{boardId}/features/{featureId}/spec/unfinalize:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    post:
      summary: 확정 해제 (ADMIN). 반영 대기 입력이 있으면 갱신 작업을 등록한다
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SpecView'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 확정 상태가 아님}
  /boards/{boardId}/features/{featureId}/spec/retry:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    post:
      summary: 실패한 갱신 재시도 (ADMIN)
      responses:
        '202': {description: 작업 등록됨}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 재시도할 작업이 없거나 확정 상태이거나 이미 진행 중}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: session}
  parameters:
    boardId: {name: boardId, in: path, required: true, schema: {type: string}}
    featureId: {name: featureId, in: path, required: true, schema: {type: string}}
    number: {name: number, in: path, required: true, schema: {type: integer, minimum: 1}}
  responses:
    Forbidden: {description: 권한 없음 또는 보드 비멤버}
  schemas:
    SpecStatus: {type: string, enum: [NONE, IDLE, UPDATING, FAILED, FINALIZED]}
    SourceRef:
      type: object
      properties:
        inputId: {type: string}
        kind: {type: string, enum: [MEETING_NOTE, IDEA, OPINION]}
        submitterName: {type: string}
        submittedAt: {type: string, format: date-time}
        content: {type: string}
    Item:
      type: object
      properties:
        key: {type: string}
        kind: {type: string, enum: [DECISION, REQUIREMENT]}
        text: {type: string, maxLength: 2000}
        sources: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SourceRef'}}
    Question:
      type: object
      properties:
        key: {type: string}
        text: {type: string, maxLength: 1000}
        status: {type: string, enum: [OPEN, RESOLVED]}
        sources: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SourceRef'}}
        resolvedBy: {oneOf: [{$ref: '#/components/schemas/SourceRef'}, {type: 'null'}]}
    VersionSummary:
      type: object
      properties:
        number: {type: integer}
        kind: {type: string, enum: [AI_UPDATE, REVERT]}
        revertedFromNumber: {type: [integer, 'null']}
        createdByName: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        inputIds: {type: array, items: {type: string}}
    VersionDetail:
      allOf:
        - {$ref: '#/components/schemas/VersionSummary'}
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Item'}}
            questions: {type: array, items: {$ref: '#/components/schemas/Question'}}
    SpecView:
      type: object
      properties:
        status: {$ref: '#/components/schemas/SpecStatus'}
        message: {type: [string, 'null'], description: "NONE일 때 '승인된 입력이 아직 없습니다', FAILED일 때 실패 사유 안내"}
        finalizedByName: {type: [string, 'null']}
        finalizedAt: {type: [string, 'null'], format: date-time}
        pendingInputCount: {type: integer, description: 승인되었으나 아직 반영되지 않은 입력 수}
        version: {oneOf: [{$ref: '#/components/schemas/VersionDetail'}, {type: 'null'}]}
    Diff:
      type: object
      properties:
        from: {type: integer}
        to: {type: integer}
        items:
          type: array
          items:
            type: object
            properties:
              change: {type: string, enum: [ADDED, REMOVED, CHANGED]}
              key: {type: string}
              before: {type: [string, 'null']}
              after: {type: [string, 'null']}
        questions:
          type: array
          items:
            type: object
            properties:
              change: {type: string, enum: [ADDED, REMOVED, CHANGED]}
              key: {type: string}
              before: {type: [string, 'null']}
              after: {type: [string, 'null']}
