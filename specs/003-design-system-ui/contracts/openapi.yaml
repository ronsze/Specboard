openapi: 3.1.0
info:
  title: Specboard - 디자인 시안 적용 (001·002 계약에 대한 증분)
  version: 0.1.0
  description: >
    이 문서는 003에서 추가·변경되는 API만 담는다. 기존 경로는 그대로 유지되며
    (하위 호환), 변경된 응답 스키마는 기존 필드를 제거하지 않고 필드를 추가한다.
    모바일 클라이언트가 같은 API를 쓸 수 있도록 모든 화면용 데이터는 JSON으로도 제공한다.
servers:
  - url: /api
security:
  - session: []
paths:
  /home:
    get:
      summary: 홈 요약 (로그인한 사용자가 속한 보드만)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HomeView'}}}}
        '403': {description: 로그인 필요}
  /boards/{boardId}/pending:
    parameters:
      - {$ref: '#/components/parameters/boardId'}
      - {name: feature, in: query, required: false, schema: {type: string}, description: 이 feature의 대기 입력만}
    get:
      summary: 보드 단위 승인 대기 목록 (ADMIN). 제출 시각 오름차순
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PendingInput'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /boards/{boardId}/pending/count:
    parameters: [{$ref: '#/components/parameters/boardId'}]
    get:
      summary: 보드의 승인 대기 입력 수 (ADMIN). 상단 배지용
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {count: {type: integer}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /boards/{boardId}/features/{featureId}/inputs/view:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    get:
      summary: 입력 목록 뷰 (전 역할, 가시성 규칙 적용). 필터, 개수, 페이지
      parameters:
        - {name: filter, in: query, schema: {$ref: '#/components/schemas/InputFilter'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string}, description: 이전 응답의 nextCursor}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InputView'}}}}
        '400': {description: 잘못된 filter·limit}
        '403': {$ref: '#/components/responses/Forbidden'}
  /boards/{boardId}/features/{featureId}/spec/revert-preview:
    parameters:
      - {$ref: '#/components/parameters/boardId'}
      - {$ref: '#/components/parameters/featureId'}
      - {name: toVersion, in: query, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: 되돌리기 영향 미리보기 (ADMIN). 저장하지 않는 계산
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RevertPreview'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없는 버전}
        '409': {description: 확정 상태}
  /boards/{boardId}/features/{featureId}/spec/revert:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    post:
      summary: (변경) 되돌리기. expected를 보내면 미리보기와 달라졌을 때 실행하지 않는다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toVersion]
              properties:
                toVersion: {type: integer, minimum: 1}
                expected: {$ref: '#/components/schemas/RevertExpected'}
      responses:
        '201': {description: 새 버전}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없는 버전}
        '409':
          description: 확정 상태, 최신과 같은 내용, 또는 미리보기가 달라짐(code=PREVIEW_CHANGED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  code: {type: string, enum: [FINALIZED, NO_CHANGE, PREVIEW_CHANGED]}
                  preview: {$ref: '#/components/schemas/RevertPreview'}
  /boards/{boardId}/features/{featureId}/spec:
    parameters: [{$ref: '#/components/parameters/boardId'}, {$ref: '#/components/parameters/featureId'}]
    get:
      summary: (변경) 현재 spec. 항목 번호·변경 표시·발췌, 진행·실패 정보, 최근 버전이 추가된다
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SpecView'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /boards/{boardId}/features/{featureId}/spec/diff:
    parameters:
      - {$ref: '#/components/parameters/boardId'}
      - {$ref: '#/components/parameters/featureId'}
      - {name: from, in: query, required: true, schema: {type: integer, minimum: 1}}
      - {name: to, in: query, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: (변경) 두 버전 비교. 개수 요약, 라벨, 새 출처가 추가된다. from과 to가 같으면 400
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Diff'}}}}
        '400': {description: 같은 버전 비교}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없는 버전}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: session}
  parameters:
    boardId: {name: boardId, in: path, required: true, schema: {type: string}}
    featureId: {name: featureId, in: path, required: true, schema: {type: string}}
  responses:
    Forbidden: {description: 권한 없음 또는 보드 비멤버}
  schemas:
    Role: {type: string, enum: [ADMIN, MEMBER, VIEWER]}
    InputFilter: {type: string, enum: [all, mine-pending, reflect-pending, rejected], default: all}
    InputRef:
      type: object
      properties:
        id: {type: string}
        number: {type: integer, description: 표시는 IN-{number}}
    Input:
      description: 001의 Input에 number가 추가된다
      type: object
      properties:
        id: {type: string}
        number: {type: integer}
        featureId: {type: string}
        kind: {type: string, enum: [MEETING_NOTE, IDEA, OPINION]}
        content: {type: string}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        submitterName: {type: string}
        submittedAt: {type: string, format: date-time}
        autoApproved: {type: boolean}
        decidedByName: {type: [string, 'null']}
        decidedAt: {type: [string, 'null'], format: date-time}
        rejectionReason: {type: [string, 'null']}
        reflectedInSpec: {type: boolean}
        reflectedVersion: {type: [integer, 'null'], description: 반영된 버전 번호}
        isMine: {type: boolean}
    PendingInput:
      allOf:
        - {$ref: '#/components/schemas/Input'}
        - type: object
          properties:
            projectName: {type: string}
            featureName: {type: string}
    InputView:
      type: object
      properties:
        inputs: {type: array, items: {$ref: '#/components/schemas/Input'}}
        counts:
          type: object
          properties:
            all: {type: integer}
            minePending: {type: integer}
            reflectPending: {type: integer}
            rejected: {type: integer}
        nextCursor: {type: [string, 'null']}
    SourceRef:
      type: object
      properties:
        inputId: {type: string}
        number: {type: integer}
        kind: {type: string, enum: [MEETING_NOTE, IDEA, OPINION]}
        submitterName: {type: string}
        submittedAt: {type: string, format: date-time}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        content: {type: string}
        quote:
          oneOf:
            - type: object
              properties:
                start: {type: integer, minimum: 0}
                end: {type: integer}
            - type: 'null'
          description: 원문에서 강조할 구간(문자 오프셋). 없으면 null
    Item:
      type: object
      properties:
        key: {type: string}
        kind: {type: string, enum: [DECISION, REQUIREMENT]}
        number: {type: integer}
        label: {type: string, description: 'D-1, R-2 형식'}
        text: {type: string}
        firstVersion: {type: integer}
        lastChangedVersion: {type: integer}
        change: {type: string, enum: [NONE, ADDED, CHANGED], description: 최신 버전 기준}
        sources: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SourceRef'}}
    Question:
      type: object
      properties:
        key: {type: string}
        text: {type: string}
        status: {type: string, enum: [OPEN, RESOLVED]}
        label: {type: string, description: 'Q-1 형식(버전 안의 표시 순서)'}
        resolvedInVersion: {type: [integer, 'null']}
        sources: {type: array, items: {$ref: '#/components/schemas/SourceRef'}}
        resolvedBy: {oneOf: [{$ref: '#/components/schemas/SourceRef'}, {type: 'null'}]}
    VersionSummary:
      type: object
      properties:
        number: {type: integer}
        kind: {type: string, enum: [AI_UPDATE, REVERT]}
        revertedFromNumber: {type: [integer, 'null']}
        createdByName: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        inputs: {type: array, items: {$ref: '#/components/schemas/InputRef'}}
        isCurrent: {type: boolean}
    SpecView:
      type: object
      properties:
        status: {type: string, enum: [NONE, IDLE, UPDATING, FAILED, FINALIZED]}
        message: {type: [string, 'null']}
        finalizedByName: {type: [string, 'null']}
        finalizedAt: {type: [string, 'null'], format: date-time}
        pendingInputCount: {type: integer}
        progress:
          oneOf:
            - type: object
              properties: {inputCount: {type: integer, description: 이번 갱신이 읽는 입력 수}}
            - type: 'null'
        failure:
          oneOf:
            - type: object
              properties:
                attempts: {type: integer}
                at: {type: string, format: date-time}
                code: {type: string, enum: [REFUSED, INVALID_OUTPUT, API_ERROR, TIMEOUT]}
                nextVersion: {type: integer, description: 생성하려던 버전 번호}
            - type: 'null'
        version:
          oneOf:
            - type: object
              allOf:
                - {$ref: '#/components/schemas/VersionSummary'}
                - type: object
                  properties:
                    items: {type: array, items: {$ref: '#/components/schemas/Item'}}
                    questions: {type: array, items: {$ref: '#/components/schemas/Question'}}
                    counts:
                      type: object
                      properties:
                        decisions: {type: integer}
                        requirements: {type: integer}
                        openQuestions: {type: integer}
                        resolvedQuestions: {type: integer}
            - type: 'null'
        recentVersions: {type: array, items: {$ref: '#/components/schemas/VersionSummary'}, maxItems: 3}
    Change:
      type: object
      properties:
        change: {type: string, enum: [ADDED, REMOVED, CHANGED]}
        scope: {type: string, enum: [ITEM, QUESTION]}
        key: {type: string}
        label: {type: string}
        kind: {type: [string, 'null']}
        before: {type: [string, 'null']}
        after: {type: [string, 'null']}
        addedSources: {type: array, items: {$ref: '#/components/schemas/InputRef'}}
    Diff:
      type: object
      properties:
        from: {type: integer}
        to: {type: integer}
        summary:
          type: object
          properties:
            added: {type: integer}
            removed: {type: integer}
            changed: {type: integer}
            unchanged: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/Change'}}
        questions: {type: array, items: {$ref: '#/components/schemas/Change'}}
    RevertExpected:
      type: object
      required: [latestVersion, removedItems, reopenedQuestions]
      properties:
        latestVersion: {type: integer}
        removedItems: {type: integer}
        reopenedQuestions: {type: integer}
    RevertPreview:
      type: object
      properties:
        toVersion: {type: integer}
        latestVersion: {type: integer}
        newVersion: {type: integer, description: 되돌리면 만들어질 버전 번호}
        removedItems: {type: integer}
        reopenedQuestions: {type: integer}
        removedLabels: {type: array, items: {type: string}}
        reopenedLabels: {type: array, items: {type: string}}
        finalized: {type: boolean}
    HomeView:
      type: object
      properties:
        user: {type: object, properties: {name: {type: string}}}
        boards:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              role: {$ref: '#/components/schemas/Role'}
              pendingApprovalCount: {type: [integer, 'null'], description: ADMIN일 때만}
              projects:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    features:
                      type: array
                      items:
                        type: object
                        properties:
                          id: {type: string}
                          name: {type: string}
                          specStatus: {type: string, enum: [NONE, IDLE, UPDATING, FAILED, FINALIZED]}
                          latestVersion: {type: [integer, 'null']}
                          latestVersionAt: {type: [string, 'null'], format: date-time}
                          pendingReflectCount: {type: integer}
                          updatingToVersion: {type: [integer, 'null']}
